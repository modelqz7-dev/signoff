<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Код подтверждения</title>
</head>
<body style="margin:0;padding:0;background:#f4f3f1;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Код для подтверждения действия в Nodly.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f3f1;padding:40px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
      <tr><td style="padding:0 4px 20px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="vertical-align:middle;"><img src="{{ .SiteURL }}/brand/nodly-key-light.png" width="36" height="36" alt="Nodly" style="display:block;border:0;"></td>
          <td style="vertical-align:middle;padding-left:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.03em;color:#171615;">Nodly</td>
        </tr></table>
      </td></tr>
      <tr><td style="background:#ffffff;border:1px solid #e7e5e2;border-radius:16px;padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;color:#171615;">
        <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.02em;">Код подтверждения</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#4a4744;">Введите этот код в Nodly, чтобы подтвердить смену пароля:</p>
        <div style="display:inline-block;padding:16px 24px;background:#f4f3f1;border:1px solid #e7e5e2;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:0.3em;color:#171615;">{{ .Token }}</div>
        <p style="margin:28px 0 0;padding-top:20px;border-top:1px solid #efedea;font-size:13px;line-height:1.6;color:#8a8783;">Код действует несколько минут. Если вы ничего не меняли, никому не сообщайте код и смените пароль.</p>
      </td></tr>
      <tr><td style="padding:20px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#8a8783;">
        Nodly — согласование макетов с клиентами.<br>
        <a href="{{ .SiteURL }}" style="color:#8a8783;text-decoration:underline;">{{ .SiteURL }}</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
