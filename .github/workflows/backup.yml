# Daily encrypted backup of the Nodly database (Supabase's free plan has no backups).
#
# Setup (GitHub → repo → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL    Supabase → Connect → "Session pooler" connection string, with your
#                      database password filled in (the direct connection needs IPv6, which
#                      GitHub runners don't have).
#   BACKUP_PASSPHRASE  Any long random string. Keep a copy somewhere safe: without it the
#                      backups can't be opened.
#
# Backups are kept as workflow artifacts for 30 days (Actions → Database backup → a run).
# Restore: gpg --decrypt nodly-db.sql.gz.gpg | gunzip | psql "<connection string>"
# Files in Storage (PDFs, images) are not included.
name: Database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump and encrypt
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL}" ] || [ -z "${PASSPHRASE}" ]; then
            echo "::warning::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets to enable backups."
            exit 0
          fi
          docker run --rm -e DB_URL postgres:17 \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges --schema=public' \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "${PASSPHRASE}" \
                  --symmetric --cipher-algo AES256 -o nodly-db.sql.gz.gpg
          ls -lh nodly-db.sql.gz.gpg
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Keep for 30 days
        if: steps.dump.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nodly-db-${{ github.run_number }}
          path: nodly-db.sql.gz.gpg
          retention-days: 30
